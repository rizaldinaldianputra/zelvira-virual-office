services:
  zelvira-office:
    build:
      context: .
      dockerfile: Dockerfile
    image: zelvira-virtual-office:latest
    container_name: zelvira-virtual-office
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - OFFICE_DB_PATH=/app/data/office.db
      - HERMES_HOME=/root/.hermes
      - HERMES_BIN=/usr/local/bin/hermes
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
    volumes:
      - office-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:3000\", (r) => { process.exit(r.statusCode === 200 || r.statusCode === 304 ? 0 : 1); })'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  office-data:
    driver: local
